<?xml version="1.0" encoding="UTF-8"?>
<!-- estrellas — solo las marcas, sobre un cuadrado de 1000×1000.
     El racimo va en la mitad y ocupa el 55,3% del lado. Las otras tres banderas
     escalan su arte por la proporción horizontal del original (1000/1440)
     porque su dibujo va amarrado al ancho —la palabra, las barras—; aquí no hay
     nada a qué amarrarse, así que el racimo se mide contra el lado corto
     (1000/1024) y conserva el tamaño que tenía.
     El campo de color no está aquí: lo pinta el script de la bandera (nav.md,
     sección 7) sobre la pantalla entera, para que una sola geometría mande en
     cada región y no haya costura contra el cuadrado.
     El original de 1440×1024, completo, está en originales/. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <g transform="translate(-203.17 7.86) scale(0.9765625)">
    <path fill="#0015ff" d="M720,393l17.74,54.59h57.4l-46.43,33.74,17.74,54.59-46.44-33.74-46.43,33.74,17.74-54.59-46.43-33.74h57.4l17.74-54.59Z"/>
    <path fill="#1f191b" d="M512,472l17.74,54.59h57.4l-46.43,33.74,17.74,54.59-46.43-33.74-46.43,33.74,17.74-54.59-46.43-33.74h57.4l17.74-54.59Z"/>
    <path fill="red" d="M928.01,472l17.74,54.59h57.4l-46.44,33.74,17.74,54.59-46.43-33.74-46.43,33.74,17.74-54.59-46.43-33.74h57.4l17.74-54.59Z"/>
  </g>
</svg>
